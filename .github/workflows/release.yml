name: Native releases

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.6

      - name: Verify native macOS ARM64 runner
        if: matrix.target == 'macos-arm64'
        run: |
          test "$(uname -m)" = "arm64"
          deno eval 'if (Deno.build.os !== "darwin" || Deno.build.arch !== "aarch64") throw new Error(`Unexpected runner: ${Deno.build.os}-${Deno.build.arch}`);'

      - name: Verify tag matches source version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: deno run --allow-read --allow-env=GITHUB_REF_NAME scripts/github_release_assets.ts check-tag

      - name: Build, validate, and smoke-test native release bundle
        env:
          ACPMCP_EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
        run: deno task release

      - name: Verify native macOS executable is ARM64 Mach-O
        if: matrix.target == 'macos-arm64'
        run: |
          file dist/acp-mcp
          file dist/acp-mcp | grep -E 'Mach-O.*arm64'

      - name: Stage licensed archive, checksum, and manifest
        env:
          ACPMCP_EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
        run: deno run --allow-env=ACPMCP_EXPECTED_RELEASE_TARGET --allow-read --allow-write --allow-run scripts/github_release_assets.ts stage

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/github-release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release without replacing an existing tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG; refusing to replace its assets."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "acp-mcp $version"

  verify-public:
    name: Verify public ${{ matrix.target }} package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.6

      - name: Download this target's public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist/public-release
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/public-release \
            --pattern "acp-mcp-${GITHUB_REF_NAME#v}-${{ matrix.target }}*"

      - name: Verify downloaded package and smoke-test native executable
        run: deno run --allow-env --allow-read --allow-write --allow-run scripts/verify_public_release.ts dist/public-release ${{ matrix.target }}
